name: Publish to NPM

on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pinned npm (trusted publishing requires >= 11.5.1)
        run: npm install -g npm@11.21.0

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Update package.json version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' is not a valid semver version"
            exit 1
          fi
          echo "Syncing version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i "s/@version .*/@version $VERSION/" src/plugin.js

      - run: npm publish
