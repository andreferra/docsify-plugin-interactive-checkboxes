name: Publish to NPM

on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pinned npm (trusted publishing requires >= 11.5.1)
        run: npm install -g npm@11.21.0

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Update package.json version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' is not a valid semver version"
            exit 1
          fi
          echo "Syncing version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i "s/@version .*/@version $VERSION/" src/plugin.js

      - run: npm publish
